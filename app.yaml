apiVersion: v1
name: habit-hero
version: 0.2.0
description: Kids habit & chore tracker with an AI agent (channel-agnostic)
author: Mona-lisa-jai-kere

services:
  app:
    build: .
    resources:
      cpu: 0.5
      memory: 256M
    ports:
      # type: api → the gateway maps a direct host port (no subpath proxy), so
      # the app is served at the root path (no Next.js basePath) and the bare
      # /api/health healthcheck below is correct. Matches the working convention
      # of the other installed apps (cc-monitor, getpod-manager) on this gateway.
      - name: web
        host: 3737
        container: 4000
        type: api
    environment:
      - DATABASE_URL=postgres://habithero:${DB_PASSWORD}@db:5432/habithero
      # Uploaded photos + avatars must live on a mounted volume (decision #1),
      # NOT the container filesystem — otherwise every rebuild/reinstall wipes
      # them. The generator resolves this ./ path to an absolute bind mount.
      - PHOTO_DIR=/data/photos
      #
      # ── env for whoever/whatever is installing this app ──────────────────
      # The three !generate keys get a fresh random value from the gateway at
      # install time — nobody is asked for them. NEXTAUTH_URL is a URL, not a
      # secret; it uses the !default: marker so the install field is pre-filled
      # with the value below yet stays editable. See the "สำหรับ AI agent"
      # section in README.md.
      #
      # base64url, not base64: this value is embedded in DATABASE_URL above, so
      # it must not contain / + = .
      - DB_PASSWORD=!generate:base64url:24
      - NEXTAUTH_SECRET=!generate:base64:32
      # http://localhost:3737 — correct for local, LAN IP, and a public https
      # domain forwarding to this port. Switching to an https URL only adds the
      # Secure cookie flag, and costs http access; leave that for later. The
      # !default: marker pre-fills this at install yet stays editable — requires
      # a gateway with !default: support (claude-gateway#300).
      - NEXTAUTH_URL=!default:http://localhost:3737
      # the app rejects agent calls without a matching x-agent-token; both
      # containers read it from the same generated .env
      - AGENT_API_TOKEN=!generate:base64:32
    volumes:
      # OWNERSHIP CONTRACT — this directory must be writable by uid 0.
      #
      # The app container runs as root but the gateway gives it `cap_drop: ALL`,
      # which removes CAP_DAC_OVERRIDE. Root therefore gets no free pass on file
      # permissions: it must satisfy the mode bits like any other user.
      #
      # Docker creates a missing bind-mount target as root:root 755, so a normal
      # install already satisfies this and needs nothing done by hand. What
      # breaks it is restoring the directory from a backup as another user
      # (`tar -x` as ubuntu leaves it ubuntu:ubuntu 755) — root then has r-x
      # only, every upload fails with EACCES, and photos already stored keep
      # serving fine, which makes it look like an app bug rather than a mount.
      #
      # Fix: `chown root:root <appdir>/data/photos` (the directory itself; the
      # files inside can stay owned by anyone as long as they are readable).
      # /api/health reports this, so the container goes unhealthy if it recurs.
      - ./data/photos:/data/photos
    depends_on: [db]
    healthcheck:
      test: wget -qO- http://127.0.0.1:4000/api/health
      interval: 30s

  db:
    image: postgres:16-alpine
    resources:
      cpu: 0.25
      memory: 256M
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    environment:
      - POSTGRES_DB=habithero
      - POSTGRES_USER=habithero
      # ${DB_PASSWORD} resolves from the .env the gateway generates once per
      # install and shares with every service, so it is declared in the app
      # service only — repeating the declaration here would change nothing.
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./postgres/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U habithero
      interval: 10s

  agent:
    path: ./agent
    name: habit-hero-bot
