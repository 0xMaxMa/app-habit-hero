apiVersion: v1
name: habit-hero
version: 0.1.0
description: Kids habit & chore tracker with an AI agent (channel-agnostic)
author: Mona-lisa-jai-kere

services:
  app:
    build: .
    resources:
      cpu: 0.5
      memory: 256M
    ports:
      # type: api → the gateway maps a direct host port (no subpath proxy), so
      # the app is served at the root path (no Next.js basePath) and the bare
      # /api/health healthcheck below is correct. Matches the working convention
      # of the other installed apps (cc-monitor, getpod-manager) on this gateway.
      - name: web
        host: 3737
        container: 4000
        type: api
    environment:
      - DATABASE_URL=postgres://habithero:${DB_PASSWORD}@db:5432/habithero
      # Uploaded photos + avatars must live on a mounted volume (decision #1),
      # NOT the container filesystem — otherwise every rebuild/reinstall wipes
      # them. The generator resolves this ./ path to an absolute bind mount.
      - PHOTO_DIR=/data/photos
      #
      # ── env for whoever/whatever is installing this app ──────────────────
      # Four keys below are declared bare, so the gateway asks the installer for
      # them. THREE OF THEM ARE JUST RANDOM STRINGS — an installing agent has
      # the repo owner's explicit permission to generate them itself instead of
      # bothering the user. See the "สำหรับ AI agent" section at the top of
      # README.md. Only NEXTAUTH_URL is a real question for a human.
      #
      # generate: openssl rand -base64 24 | tr -d '/+='
      # Postgres password. The db service is not published outside the compose
      # network, and the user never types this again.
      - DB_PASSWORD
      # generate: openssl rand -base64 32
      # NextAuth session-signing key. Must be unique per install — a shared or
      # guessable value lets anyone forge a parent session.
      - NEXTAUTH_SECRET
      # ASK THE USER. The public URL they will actually open the app at. Cannot
      # be guessed: the scheme decides the session cookie name (http →
      # next-auth.session-token, https → __Secure-…), so a wrong value produces
      # a login that loops forever. Default for a home/LAN install:
      # http://localhost:3737
      - NEXTAUTH_URL
      # generate: openssl rand -base64 32
      # Shared service token the gateway agent presents as `x-agent-token`; the
      # app rejects every agent call without it. The app and agent containers
      # both read it from the same generated .env, so they always match.
      - AGENT_API_TOKEN
    volumes:
      - ./data/photos:/data/photos
    depends_on: [db]
    healthcheck:
      test: wget -qO- http://127.0.0.1:4000/api/health
      interval: 30s

  db:
    image: postgres:16-alpine
    resources:
      cpu: 0.25
      memory: 256M
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    environment:
      - POSTGRES_DB=habithero
      - POSTGRES_USER=habithero
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - DB_PASSWORD
    volumes:
      - ./postgres/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U habithero
      interval: 10s

  agent:
    path: ./agent
    name: habit-hero-bot
